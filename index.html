<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#6F4E37"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- ================= SEO ================= -->

    <title>
      Koala Caff | Premium Café in Jaipur | Coffee, Food & Desserts
    </title>

    <meta
      name="description"
      content="Koala Caff is a premium café in Jaipur serving handcrafted coffee, delicious food, desserts and a cozy modern ambience."
    />

    <meta
      name="keywords"
      content="Koala Caff, Koala Cafe Jaipur, Best Cafe Jaipur, Coffee Shop Jaipur, Cafe in Jaipur, Premium Coffee, Desserts, Food"
    />

    <meta
      name="author"
      content="Koala Caff"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- ================= Canonical ================= -->

    <link
      rel="canonical"
      href="https://koalacaff.com/"
    />

    <!-- ================= Favicons ================= -->

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- ================= Open Graph ================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Koala Caff | Premium Café in Jaipur"
    />

    <meta
      property="og:description"
      content="Experience handcrafted coffee, delicious food and a cozy ambience at Koala Caff."
    />

    <meta
      property="og:url"
      content="https://koalacaff.com/"
    />

    <meta
      property="og:site_name"
      content="Koala Caff"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:image"
      content="https://koalacaff.com/og-image.jpg"
    />

    <!-- ================= Twitter ================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Koala Caff | Premium Café in Jaipur"
    />

    <meta
      name="twitter:description"
      content="Handcrafted Coffee • Fresh Food • Cozy Ambience"
    />

    <meta
      name="twitter:image"
      content="https://koalacaff.com/og-image.jpg"
    />

    <!-- ================= Google Fonts ================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ================= Local Business Schema ================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Koala Caff",
        "description": "Premium café in Jaipur serving handcrafted coffee, delicious food, desserts and a cozy ambience.",
        "telephone": "+91 9145908951",
        "email": "Caffkoala@gmail.com",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Jaipur",
          "addressRegion": "Rajasthan",
          "addressCountry": "IN"
        },
        "servesCuisine": [
          "Coffee",
          "Cafe",
          "Desserts",
          "Fast Food"
        ],
        "sameAs": [
          "https://www.instagram.com/koalacaff/reels/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
